<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camila Términe, modo exploración</title>
  <meta name="description" content="Portfolio jugable de Camila Términe: recorré su estudio en pixel art y descubrí sus proyectos, experiencia y contacto.">
  <meta name="author" content="Camila Denise Términe">
  <meta name="theme-color" content="#1a1423">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%233b2f5c'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-weight='700' font-size='30' fill='%23f0b64a'%3ECT%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="room.css">
  <script>
    try {
      const l = localStorage.getItem('lang');
      if (l) document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="bar">
    <a class="bar-btn" href="index.html" id="classic-link">← Versión clásica</a>
    <p class="bar-title">Camila Términe</p>
    <div class="bar-actions">
      <button class="bar-btn bar-icon" id="sound-toggle" aria-pressed="false" aria-label="Silenciar sonido">
        <svg viewBox="0 0 16 16" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="currentColor" d="M2 6h3v4H2zM5 5h1v6H5zM6 4h1v8H6zM7 3h1v10H7z"/>
          <path class="snd-on" fill="currentColor" d="M10 6h1v4h-1zM12 4h1v8h-1zM11 5h1v1h-1zM11 10h1v1h-1zM13 3h1v1h-1zM13 12h1v1h-1z"/>
          <path class="snd-off" fill="currentColor" d="M10 5h1v1h-1zM11 6h1v1h-1zM12 7h1v2h-1zM11 9h1v1h-1zM10 10h1v1h-1zM14 5h-1v1h1zM13 6h-1v1h1zM13 9h-1v1h1zM14 10h-1v1h1z"/>
        </svg>
      </button>
      <button class="bar-btn" id="lang-toggle" aria-label="Cambiar idioma / Switch language">EN</button>
      <a class="bar-btn bar-cv" href="cv-es.pdf" download id="cv-link">CV</a>
    </div>
  </header>

  <main class="stage">
    <div id="game" class="game" aria-hidden="true"></div>
    <p class="hint" id="hint"></p>
    <button class="act-btn" id="act-btn" hidden>E</button>

    <!-- Menú accesible: abre los mismos paneles sin caminar -->
    <nav class="rooms" aria-label="Secciones">
      <ul id="room-menu"></ul>
    </nav>
  </main>

  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button class="panel-close" id="panel-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="data.js"></script>
  <script src="room.js"></script>
</body>
</html>
